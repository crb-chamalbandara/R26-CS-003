<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="860" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">WebSentinel &#8212; System Architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#64748b">Electron desktop app + local FastAPI backend with four detection components (C1&#8211;C4)</text>

  <!-- Desktop app -->
  <rect x="40" y="90" width="1120" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="116" font-size="16" font-weight="700" fill="#3730a3">Desktop application (Electron 27)</text>
  <rect x="60" y="130" width="520" height="56" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="76" y="154" font-size="14" font-weight="600" fill="#1e1b4b">Main process &#8212; electron/main.js</text>
  <text x="76" y="173" font-size="12.5" fill="#475569">Starts the backend, polls /health, single instance, kills process tree on exit</text>
  <rect x="600" y="130" width="540" height="56" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="616" y="154" font-size="14" font-weight="600" fill="#1e1b4b">Dashboard UI &#8212; frontend/dashboard.html</text>
  <text x="616" y="173" font-size="12.5" fill="#475569">Live alerts, C1 install monitor and reports, C3 hosts, C4 timeline, settings</text>

  <!-- arrow UI <-> gateway -->
  <line x1="600" y1="200" x2="600" y2="242" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="614" y="226" font-size="12.5" fill="#334155">REST + WebSocket  /ws/events</text>

  <!-- Gateway -->
  <rect x="40" y="244" width="700" height="96" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="60" y="270" font-size="16" font-weight="700" fill="#155e75">FastAPI gateway &#8212; core/main.py  (127.0.0.1:8765)</text>
  <text x="60" y="294" font-size="13" fill="#334155">/analyze  &#183;  /extension/*  &#183;  /session/*  &#183;  /c3/*  &#183;  /forensic/*  &#183;  /alerts  &#183;  /settings</text>
  <text x="60" y="316" font-size="13" fill="#334155">Weighted fusion of component scores &#8594; verdict and WebSocket broadcast. Packaged as a PyInstaller exe.</text>

  <!-- Playwright -->
  <rect x="780" y="244" width="380" height="96" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="270" font-size="16" font-weight="700" fill="#166534">Playwright session</text>
  <text x="800" y="294" font-size="13" fill="#334155">Persistent, headed Chromium (monitored browsing)</text>
  <text x="800" y="316" font-size="13" fill="#334155">Navigation, DOM, screenshots, network, installs</text>
  <line x1="780" y1="292" x2="742" y2="292" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- fan-out lines gateway -> components -->
  <line x1="172" y1="340" x2="172" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="457" y1="340" x2="457" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="340" x2="742" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="340" x2="1027" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- C1 -->
  <rect x="40" y="390" width="265" height="290" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="56" y="416" font-size="16" font-weight="700" fill="#9a3412">C1 &#183; Extension Analyzer</text>
  <text x="56" y="436" font-size="12" fill="#7c2d12">core/c1</text>
  <g font-size="13" fill="#1f2937">
    <text x="56" y="466">&#8226; Blocklist (6,656 known IDs)</text>
    <text x="56" y="490">&#8226; Manifest + code features (33)</text>
    <text x="56" y="514">&#8226; XGBoost static classifier</text>
    <text x="56" y="538">&#8226; Isolation Forest anomaly layer</text>
    <text x="56" y="562">&#8226; Rule-based score boosters</text>
    <text x="56" y="586">&#8226; Dynamic sandbox (Chromium)</text>
    <text x="56" y="610">&#8226; Fusion 0.7 static + 0.3 dynamic</text>
    <text x="56" y="634">&#8226; Live "Add to Chrome" intercept</text>
    <text x="56" y="658">&#8226; PDF / JSON / text reports</text>
  </g>

  <!-- C2 -->
  <rect x="325" y="390" width="265" height="290" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="341" y="416" font-size="16" font-weight="700" fill="#991b1b">C2 &#183; BiTB Phishing Detector</text>
  <text x="341" y="436" font-size="12" fill="#7f1d1d">core/c2</text>
  <g font-size="13" fill="#1f2937">
    <text x="341" y="466">&#8226; L1  BitB DOM + HTML classifier</text>
    <text x="341" y="490">&#8226; L2  URL classifier</text>
    <text x="341" y="514">&#8226; L3  Visual brand similarity (pHash)</text>
    <text x="341" y="538">&#8226; L4  Form destination analysis</text>
    <text x="341" y="562">&#8226; L5  Reputation + verified domains</text>
    <text x="341" y="586">&#8226; L6  Runtime behaviour probe</text>
    <text x="341" y="610">&#8226; Verdict: SAFE / SUSPICIOUS / PHISHING</text>
    <text x="341" y="634">&#8226; Alert store (SQLite)</text>
    <text x="341" y="658">&#8226; HTML, JSON, CSV, SIEM export</text>
  </g>

  <!-- C3 -->
  <rect x="610" y="390" width="265" height="290" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="626" y="416" font-size="16" font-weight="700" fill="#6b21a8">C3 &#183; C2 Beacon Detector</text>
  <text x="626" y="436" font-size="12" fill="#581c87">core/c3</text>
  <g font-size="13" fill="#1f2937">
    <text x="626" y="466">&#8226; Request interceptor</text>
    <text x="626" y="490">&#8226; Per-host traffic windows</text>
    <text x="626" y="514">&#8226; Behavioural feature engine</text>
    <text x="626" y="538">&#8226; ML beacon classifier</text>
    <text x="626" y="562">&#8226; Heuristic rules</text>
    <text x="626" y="586">&#8226; Reputation engine + context tagger</text>
    <text x="626" y="610">&#8226; Risk fusion</text>
    <text x="626" y="634">&#8226; Auto-block + analyst feedback</text>
    <text x="626" y="658">&#8226; Alert + block stores (SQLite)</text>
  </g>

  <!-- C4 -->
  <rect x="895" y="390" width="265" height="290" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="911" y="416" font-size="16" font-weight="700" fill="#075985">C4 &#183; Forensic Correlation</text>
  <text x="911" y="436" font-size="12" fill="#0c4a6e">core/c4</text>
  <g font-size="13" fill="#1f2937">
    <text x="911" y="466">&#8226; Browser profile extractor</text>
    <text x="911" y="490">&#8226; History, cookies, logins,</text>
    <text x="911" y="508">   downloads, extensions, storage</text>
    <text x="911" y="532">&#8226; Single-artifact rule engine</text>
    <text x="911" y="556">&#8226; 7 cross-artifact detectors</text>
    <text x="911" y="580">&#8226; MITRE ATT&amp;CK mapper</text>
    <text x="911" y="604">&#8226; Timeline reconstruction</text>
    <text x="911" y="628">&#8226; HTML, JSON, SIEM reports</text>
  </g>

  <!-- Storage -->
  <rect x="40" y="716" width="700" height="112" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="742" font-size="15" font-weight="700" fill="#334155">Local storage</text>
  <g font-size="13" fill="#1f2937">
    <text x="60" y="768">&#8226; models/  &#8212; XGBoost, Isolation Forest, URL / BitB / beacon classifiers</text>
    <text x="60" y="790">&#8226; data/  &#8212; logo hashes, verified domains, training sets</text>
    <text x="60" y="812">&#8226; %USERPROFILE%\.websentinel  &#8212; alert databases, browser profile, C4 reports</text>
  </g>

  <!-- External -->
  <rect x="780" y="716" width="380" height="112" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="800" y="742" font-size="15" font-weight="700" fill="#334155">External services (optional)</text>
  <g font-size="13" fill="#1f2937">
    <text x="800" y="768">&#8226; Chrome Web Store (extension download)</text>
    <text x="800" y="790">&#8226; Google Safe Browsing, PhishTank</text>
    <text x="800" y="812">&#8226; Windows Sandbox (C1 VM isolation)</text>
  </g>

  <!-- component -> storage arrows -->
  <line x1="172" y1="680" x2="172" y2="714" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="457" y1="680" x2="457" y2="714" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="700" y1="680" x2="700" y2="714" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
